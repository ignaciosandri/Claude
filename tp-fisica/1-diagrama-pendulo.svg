<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/>
    </marker>
    <marker id="flecha-gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <pattern id="rayado" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#333" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="640" height="520" fill="#fff"/>

  <!-- Techo -->
  <rect x="220" y="40" width="160" height="14" fill="url(#rayado)"/>
  <line x1="220" y1="54" x2="380" y2="54" stroke="#333" stroke-width="2"/>

  <!-- Vertical de referencia (posición de equilibrio) -->
  <line x1="300" y1="60" x2="300" y2="400" stroke="#888" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- Trayectoria (arco) -->
  <path d="M 150 319.8 A 300 300 0 0 0 450 319.8" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- Hilo -->
  <line x1="300" y1="60" x2="450" y2="319.8" stroke="#333" stroke-width="2"/>
  <circle cx="300" cy="60" r="4" fill="#333"/>
  <text x="352" y="180" font-size="16" fill="#333" font-style="italic">L</text>

  <!-- Ángulo θ en el punto de suspensión -->
  <path d="M 300 120 A 60 60 0 0 0 330 111.96" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="312" y="140" font-size="18" fill="#333" font-style="italic">θ</text>

  <!-- Prolongación del hilo (dirección radial) -->
  <line x1="450" y1="319.8" x2="535" y2="467" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Componentes del peso -->
  <line x1="450" y1="319.8" x2="514.95" y2="432.3" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <line x1="450" y1="319.8" x2="385.05" y2="357.3" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#flecha-azul)"/>
  <!-- Líneas de construcción (paralelogramo) -->
  <line x1="514.95" y1="432.3" x2="450" y2="469.8" stroke="#1f5fbf" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="385.05" y1="357.3" x2="450" y2="469.8" stroke="#1f5fbf" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="522" y="420" font-size="16" fill="#1f5fbf"><tspan font-weight="bold">P</tspan> cos θ</text>
  <text x="300" y="385" font-size="16" fill="#1f5fbf"><tspan font-weight="bold">P</tspan> sen θ</text>

  <!-- Tensión -->
  <line x1="450" y1="319.8" x2="385" y2="207.2" stroke="#c0392b" stroke-width="3" marker-end="url(#flecha-roja)"/>
  <text x="366" y="250" font-size="20" font-weight="bold" fill="#c0392b">T</text>

  <!-- Peso -->
  <line x1="450" y1="319.8" x2="450" y2="469.8" stroke="#c0392b" stroke-width="3" marker-end="url(#flecha-roja)"/>
  <text x="434" y="494" font-size="18" fill="#c0392b"><tspan font-weight="bold">P</tspan> = m·g</text>

  <!-- Ángulo θ entre P y la dirección del hilo -->
  <path d="M 450 364.8 A 45 45 0 0 0 472.5 358.8" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="458" y="385" font-size="16" fill="#333" font-style="italic">θ</text>

  <!-- Masa -->
  <circle cx="450" cy="319.8" r="16" fill="#e9e9e9" stroke="#333" stroke-width="2"/>
  <text x="444" y="325" font-size="15" fill="#333" font-style="italic">m</text>
</svg>
